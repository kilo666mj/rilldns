name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Check CoreDNS version pins
        run: ./scripts/check-coredns-version.sh
      - name: Check diff hygiene
        run: git diff --check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build all commands
        run: go build ./...

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release bundles
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "release tags must point to protected main" >&2
            exit 1
          }
          commands="blocklist-merge rill-api rill-blocklist-refresh rill-cache-zones rill-diff rill-ha rill-mcp rill-notify rill-reconcile rill-secondary rill-telemetry rill-zone-status"
          mkdir -p dist
          for arch in amd64 arm64; do
            bundle="dist/rilldns-${VERSION}-linux-${arch}"
            mkdir -p "${bundle}/bin"
            for command in ${commands}; do
              GOARCH="${arch}" go build -trimpath -ldflags "-s -w" \
                -o "${bundle}/bin/${command}" "./cmd/${command}"
            done
            tar -C dist -czf "${bundle}.tar.gz" "$(basename "${bundle}")"
            rm -rf "${bundle}"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            dist/rilldns-*.tar.gz
            dist/SHA256SUMS
