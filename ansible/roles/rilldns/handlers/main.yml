---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart rilldns stack
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - rilldns-telemetry.service
    - rilldns.service
    - rilldns-api.service

- name: Restart secondary replication
  ansible.builtin.systemd_service:
    name: rilldns-secondary.service
    state: restarted
  listen: Restart rilldns stack
  when: rilldns_role == 'secondary'
