upstream rilldns_control {
    zone rilldns_control 64k;
    server 192.0.2.10:8083 max_fails=2 fail_timeout=5s;
    server 192.0.2.11:8083 backup max_fails=2 fail_timeout=5s;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dns.example.net;

    ssl_certificate /etc/nginx/ssl/dns.example.net.fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/dns.example.net.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://rilldns_control;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
